<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Valentín con Pochacco</title>
  <style>
    /* Ocultar scroll y ocupar toda la ventana */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    /* Fondo y estilo general */
    body {
      background: linear-gradient(45deg, #FF9AA2, #FFB7B2, #FFDAC1, #E2F0CB);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      position: relative;
    }
    /* Contenedor fijo centrado */
    .container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 2vh 2vw;
      z-index: 10;
    }
    /* Mensaje especial */
    .message {
      font-size: 2.5rem;
      color: #ff4081;
      text-shadow: 2px 2px 4px #000;
      margin-top: 1rem;
    }
    /* Imagen de Pochacco */
    .pochacco {
      max-width: 90%;
      width: auto;
      height: auto;
    }
    /* Estilo para los corazones usando clip-path para evitar cuadros adicionales */
    .heart {
      position: absolute;
      width: 50px;
      height: 50px;
      background: red;
      /* Definición de la forma del corazón mediante clip-path */
      clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
      );
      animation: float 5s linear infinite;
      opacity: 0.8;
    }
    /* Animación para que los corazones suban y se desvanezcan */
    @keyframes float {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }
    /* Ajustes para dispositivos móviles */
    @media (max-width: 600px) {
      .message {
        font-size: 2rem;
      }
      .heart {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Reemplaza esta ruta por la imagen de Pochacco que deseas utilizar -->
    <img src="img/dbdd7fc9f517e789fa29ca2239d1a617.jpg" alt="Pochacco" class="pochacco">
    <div class="message">¿Quieres ser mi San Valentín?</div>
    <div class="mensajito">Se que no somos nada pero igual queria preguntar</div>
  </div>

  <script>
    // Función para crear un corazón en una posición aleatoria dentro de la ventana
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      // Posicionar el corazón de forma aleatoria a lo ancho de la pantalla,
      // restando el ancho del corazón para que no se salga de la vista
      heart.style.left = Math.random() * (window.innerWidth - 50) + 'px';
      // Duración aleatoria entre 3 y 5 segundos para la animación
      heart.style.animationDuration = (3 + Math.random() * 2) + 's';
      document.body.appendChild(heart);

      // Eliminar el corazón una vez finalizada la animación
      setTimeout(() => {
        heart.remove();
      }, (parseFloat(heart.style.animationDuration) * 1000) + 100);
    }

    // Crear un corazón cada 500 milisegundos
    setInterval(createHeart, 500);
  </script>
</body>
</html>
